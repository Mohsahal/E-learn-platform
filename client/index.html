<!doctype html>
<html lang="en" style="background-color: #020617;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>Nexora Learn</title>
  <script>
    // Critical: Capture the PWA install prompt at the very beginning
    window.deferredPWAPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPWAPrompt = null;
    });
  </script>
</head>

<body style="background-color: #020617;">
  <div id="root">
    <style>
      .splash-bg {
        background-color: #020617;
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }

      .splash-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.1;
        pointer-events: none;
      }

      .orb-1 {
        top: -100px;
        right: -100px;
        width: 600px;
        height: 600px;
        background: #3b82f6;
        animation: float 10s ease-in-out infinite alternate;
      }

      .orb-2 {
        bottom: -100px;
        left: -100px;
        width: 500px;
        height: 500px;
        background: #a855f7;
        animation: float 8s ease-in-out infinite alternate-reverse;
      }

      @keyframes float {
        0% { transform: translate(0, 0); }
        100% { transform: translate(50px, 50px); }
      }

      .splash-grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        opacity: 0.5;
        pointer-events: none;
      }
      
      .splash-logo-container {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 4px;
        animation: pulseLogo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .splash-nexora {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -0.05em;
        background: linear-gradient(to right, #9333ea, #4f46e5);
        -webkit-background-clip: text;
        color: transparent;
      }

      .splash-learn {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 2.5rem;
        font-weight: 300;
        letter-spacing: 0.1em;
        color: #f3f4f6;
        margin-left: 4px;
      }

      .splash-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #9333ea;
        margin-left: 8px;
        box-shadow: 0 0 20px #9333ea;
        animation: pulseDot 1.5s infinite;
      }

      @keyframes pulseLogo {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.98); }
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }

      .splash-progress-container {
        width: 200px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 4px;
        margin-top: 30px;
        overflow: hidden;
        position: relative;
        z-index: 10;
      }
      
      .splash-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #9333ea, #4f46e5);
        width: 0%;
        border-radius: 4px;
        animation: loadProgress 2s ease-in-out infinite;
      }

      @keyframes loadProgress {
        0% { width: 0%; transform: translateX(-100%); }
        50% { width: 100%; transform: translateX(0%); }
        100% { width: 100%; transform: translateX(100%); }
      }
    </style>
    <div class="splash-bg">
      <div class="splash-orb orb-1"></div>
      <div class="splash-orb orb-2"></div>
      <div class="splash-grid"></div>
      
      <div class="splash-logo-container">
        <span class="splash-nexora">NEXORA</span>
        <span class="splash-learn">LEARN</span>
        <div class="splash-dot"></div>
      </div>
      <div class="splash-progress-container">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
