<!doctype html>
<html lang="en" style="background-color: #030712;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#030712" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>Nexora — Next-Gen Education Platform</title>
  <script>
    window.deferredPWAPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPWAPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });
    window.addEventListener('appinstalled', () => {
      window.deferredPWAPrompt = null;
    });
  </script>
</head>

<body style="background-color: #030712; margin: 0; padding: 0; overflow: hidden;">
  <div id="root">
    <style>
      .luxury-splash {
        position: fixed;
        inset: 0;
        background: #030712;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        z-index: 10000;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      /* Ambient Volumetric Lighting */
      .ambient-glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(140px);
      }

      .glow-1 {
        top: 20%;
        left: 30%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
        animation: floatGlow 14s ease-in-out infinite alternate;
      }

      .glow-2 {
        bottom: 20%;
        right: 30%;
        width: 550px;
        height: 550px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
        animation: floatGlow 12s ease-in-out infinite alternate-reverse;
      }

      .glow-center {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 75%);
        animation: pulseCore 5s ease-in-out infinite alternate;
      }

      @keyframes floatGlow {
        0% {
          transform: translate(0, 0) scale(1);
        }

        50% {
          transform: translate(40px, -30px) scale(1.05);
        }

        100% {
          transform: translate(-30px, 40px) scale(0.95);
        }
      }

      @keyframes pulseCore {
        0% {
          opacity: 0.4;
          transform: translate(-50%, -50%) scale(0.9);
        }

        100% {
          opacity: 0.9;
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      /* Subtle Architectural Line Grid */
      .luxury-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 75%);
        pointer-events: none;
      }

      /* Clean Full-Bleed Centerpiece (No card box) */
      .luxury-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeInLuxury 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fadeInLuxury {
        0% {
          opacity: 0;
          transform: translateY(16px) scale(0.96);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Emblem Mark */
      .emblem-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .emblem-halo {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(99, 102, 241, 0.15) 45%, transparent 70%);
        filter: blur(16px);
        animation: haloBreath 4s ease-in-out infinite alternate;
      }

      @keyframes haloBreath {
        0% {
          transform: scale(0.85);
          opacity: 0.5;
        }

        100% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      .emblem-svg {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.25));
      }

      .ring-rotate-cw {
        transform-origin: 60px 60px;
        animation: spinCW 20s linear infinite;
      }

      .ring-rotate-ccw {
        transform-origin: 60px 60px;
        animation: spinCCW 14s linear infinite;
      }

      @keyframes spinCW {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spinCCW {
        from {
          transform: rotate(360deg);
        }

        to {
          transform: rotate(0deg);
        }
      }

      .flare-dot {
        animation: flareGlow 2s ease-in-out infinite alternate;
      }

      @keyframes flareGlow {
        0% {
          r: 2.5;
          opacity: 0.6;
        }

        100% {
          r: 4;
          opacity: 1;
          filter: drop-shadow(0 0 8px #38bdf8);
        }
      }

      /* Brand Typography */
      .brand-title-group {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .brand-name {
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: 0.25em;
        background: linear-gradient(135deg, #ffffff 0%, #f8fafc 40%, #cbd5e1 75%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        margin: 0;
        padding-left: 0.25em;
      }

      .brand-sep {
        width: 1px;
        height: 28px;
        background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      }

      .brand-suffix {
        font-size: 1.35rem;
        font-weight: 300;
        letter-spacing: 0.4em;
        color: #94a3b8;
        padding-left: 0.4em;
        text-transform: uppercase;
      }

      /* Minimalist Luxury Subtitle */
      .brand-tagline {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #64748b;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.35em;
        text-transform: uppercase;
      }

      .tagline-accent {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
      }

      /* Sleek Hairline Loader */
      .loader-container {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 260px;
      }

      .loader-track {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 999px;
        position: relative;
        overflow: hidden;
      }

      .loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, #c084fc, transparent);
        border-radius: 999px;
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
        animation: progressFlow 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes progressFlow {
        0% {
          left: -40%;
          width: 25%;
        }

        50% {
          left: 35%;
          width: 45%;
        }

        100% {
          left: 110%;
          width: 25%;
        }
      }

      .loader-status {
        margin-top: 14px;
        font-size: 0.65rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #475569;
        font-weight: 500;
        animation: statusBreathe 2s ease-in-out infinite alternate;
      }

      @keyframes statusBreathe {
        0% {
          opacity: 0.4;
        }

        100% {
          opacity: 0.85;
          color: #94a3b8;
        }
      }
    </style>

    <div class="luxury-splash">
      <div class="ambient-glow glow-1"></div>
      <div class="ambient-glow glow-2"></div>
      <div class="ambient-glow glow-center"></div>
      <div class="luxury-grid"></div>

      <div class="luxury-content">
        <!-- Precision Geometric Prism Monogram -->
        <div class="emblem-wrapper">
          <div class="emblem-halo"></div>
          <svg viewBox="0 0 120 120" class="emblem-svg">
            <defs>
              <linearGradient id="prismA" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#6366f1" />
              </linearGradient>
              <linearGradient id="prismB" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#c084fc" />
              </linearGradient>
              <linearGradient id="prismC" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#06b6d4" />
                <stop offset="100%" stop-color="#3b82f6" />
              </linearGradient>
              <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
                <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
                <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
              </linearGradient>
            </defs>

            <!-- Precision Celestial Halo Rings -->
            <circle cx="60" cy="60" r="54" fill="none" stroke="url(#haloGrad)" stroke-width="1.2"
              stroke-dasharray="14 10 4 10" class="ring-rotate-cw" />
            <circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"
              stroke-dasharray="30 40" class="ring-rotate-ccw" />

            <!-- Isometric Faceted Monogram 'N' -->
            <polygon points="36,28 46,22 46,92 36,98" fill="url(#prismA)" />
            <polygon points="46,22 84,80 74,92 36,34" fill="url(#prismB)" opacity="0.92" />
            <polygon points="74,22 84,28 84,98 74,92" fill="url(#prismC)" />

            <!-- Center Quantum Flare -->
            <circle cx="60" cy="57" r="3" fill="#ffffff" class="flare-dot" />
          </svg>
        </div>

        <!-- Luxury Typography -->
        <div class="brand-title-group">
          <h1 class="brand-name">NEXORA</h1>
        </div>

        <!-- Tagline -->
        <div class="brand-tagline">
          <span class="tagline-accent"></span>
          <span>Intelligent Learning Platform</span>
          <span class="tagline-accent"></span>
        </div>

        <!-- Minimalist Hairline Progress -->
        <div class="loader-container">
          <div class="loader-track">
            <div class="loader-bar"></div>
          </div>
          <span class="loader-status">INITIALIZING ENVIRONMENT</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
