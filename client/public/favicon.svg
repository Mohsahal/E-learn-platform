<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <defs>
    <radialGradient id="favBacklight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="favPrismA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="favPrismB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="favPrismC" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="favHaloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base for Favicon Clarity -->
  <rect width="120" height="120" rx="28" fill="#030712"/>

  <!-- Radial Aura -->
  <circle cx="60" cy="60" r="50" fill="url(#favBacklight)"/>

  <!-- Orbiting Celestial Halo Rings -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#favHaloGrad)" stroke-width="2" stroke-dasharray="14 10 4 10"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" stroke-dasharray="24 30"/>

  <!-- Isometric Faceted Monogram 'N' -->
  <g filter="url(#favGlow)">
    <polygon points="34,26 44,20 44,94 34,100" fill="url(#favPrismA)"/>
    <polygon points="44,20 86,80 76,94 34,34" fill="url(#favPrismB)" opacity="0.95"/>
    <polygon points="76,20 86,26 86,100 76,94" fill="url(#favPrismC)"/>
    <!-- Center Quantum Flare -->
    <circle cx="60" cy="57" r="3.5" fill="#ffffff"/>
  </g>
</svg>
